on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  DeterminateCI:
    uses: DeterminateSystems/ci/.github/workflows/workflow.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      fail-fast: false

  test-sandbox:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Permit the nested user namespace
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          echo "before:"
          cat /proc/sys/user/max_user_namespaces || true
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null \
            || echo "no apparmor restriction on this runner"

          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

          if ! unshare -Ur true; then
            echo "::error::this runner refuses a user namespace, so the sandbox" \
                 "tests cannot run here. NOT skipping: a check that was not" \
                 "made is never a pass." >&2
            exit 1
          fi
          echo "a user namespace can be made on this runner"

      - name: Prove a Seatbelt profile can be entered
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          if ! /usr/bin/sandbox-exec -p '(version 1)(allow default)' /usr/bin/true; then
            echo "::error::this runner refuses a Seatbelt profile, so the" \
                 "sandbox tests cannot run here. NOT skipping: a check that" \
                 "was not made is never a pass." >&2
            exit 1
          fi
          echo "a Seatbelt profile can be entered on this runner"

      - name: Permit a delegated cgroup
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          echo "this job starts in:"
          cat /proc/self/cgroup

          # **The cgroup layer is the third sandbox layer, and it was the only
          # one this file did not prove.** Four tests in
          # lib/chock-sandbox/linux/cgroup.zig and one in linux/driver.zig need
          # an ancestor cgroup that delegates the controllers AND that this
          # user may create a subdirectory in. A runner puts every step under
          # system.slice, which delegates nothing, so all five answered
          # SkipZigTest and the layer went untested. Measured on the author's
          # own machine: with the cgroup below, skips drop from 9 to 4 and the
          # five run and pass.
          sudo mkdir -p /sys/fs/cgroup/chock/leaf
          echo "+cpu +io +memory +pids" \
            | sudo tee /sys/fs/cgroup/chock/cgroup.subtree_control > /dev/null
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/chock

          # The proof, and not the assumption: make a directory as this user,
          # which is the one thing every one of those tests does first.
          if ! mkdir /sys/fs/cgroup/chock/proof; then
            echo "::error::this runner refuses a delegated cgroup, so the" \
                 "cgroup tests cannot run here. NOT skipping: a check that" \
                 "was not made is never a pass." >&2
            exit 1
          fi
          rmdir /sys/fs/cgroup/chock/proof
          echo "a cgroup can be delegated on this runner"

      - name: Test the sandbox for real
        run: |
          set -euo pipefail
          # **The move happens here and not in the step above**, because every
          # step is its own shell and a cgroup a dead shell was in moves
          # nothing. The tests read /proc/self/cgroup and walk up from it, so
          # the process that runs them is the one that has to be inside.
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo sh -c "echo $$ > /sys/fs/cgroup/chock/leaf/cgroup.procs"
            echo "the tests run in:"
            cat /proc/self/cgroup
          fi
          nix develop --command zig build test --summary all

  release:
    if: github.event_name != 'pull_request'
    needs: [DeterminateCI, test-sandbox]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build the release artefacts
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
            *) version="0.0.0-g$(git rev-parse --short HEAD)" ;;
          esac

          mkdir -p artifacts
          # **macOS is cross compiled from here and not built on a Mac.**
          # Measured 2026-09-16: `zig build -Dtarget=aarch64-macos` on Linux
          # produces a real Mach-O arm64 executable. The site says Chock runs on
          # Linux and macOS, so a release that shipped Linux alone left half the
          # readers with no file at all.
          #
          # **Apple Silicon only, and no `x86_64-macos`.** It cross compiles
          # cleanly, so this is not a limit of the toolchain. macOS 27 shipped
          # on 2026-09-14 and dropped every Intel Mac; Tahoe 26 was the last
          # release that ran on one, and it holds security updates only into
          # 2028. A new tool shipping an Intel Mac binary now is building for a
          # platform that ended this month.
          for target in x86_64-linux aarch64-linux aarch64-macos; do
            name="chock-${version}-${target}"
            nix develop --command zig build \
              -Doptimize=ReleaseSmall \
              -Dtarget="${target}" \
              -Dversion="${version}" \
              --prefix "build/${target}"
            cp "build/${target}/bin/chock" "artifacts/${name}"
            # **A copy with no version in the name, beside the versioned one.**
            # GitHub serves `releases/latest/download/<name>`, which is a
            # permanent address only when the name never changes. The versioned
            # name changes every release and so cannot be linked to, and the
            # website would otherwise have to bake in a URL that is only as
            # fresh as its last deploy. People who want to pin still have the
            # versioned name.
            cp "build/${target}/bin/chock" "artifacts/chock-${target}"
          done

          # **A digest beside every artefact.** A tool whose whole claim is
          # about boundaries, downloaded with nothing to check it against, is
          # the first thing a sceptic points at. Written last so it covers the
          # version-less copies too.
          ( cd artifacts && sha256sum chock-* > SHA256SUMS )

          ls -l artifacts
          cat artifacts/SHA256SUMS

          reported="$(./artifacts/chock-${version}-x86_64-linux --version)"
          echo "the binary reports: ${reported}"
          case "${reported}" in
            "chock ${version}"*) ;;
            *) echo "::error::${reported} does not agree with ${version}" >&2; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v5
        with:
          name: chock-release
          path: artifacts/
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" artifacts/* --clobber

      # **A rolling build of master that a stranger can actually download.**
      # Measured 2026-09-16: a workflow artefact answers `401` to an anonymous
      # request even on a public repository, and it expires after ninety days.
      # So until this existed, nothing built from master was reachable by
      # anybody who was not signed in. A prerelease is anonymous, does not
      # expire, and is one file per target rather than a zip of all of them.
      - name: Publish the rolling unstable build
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # **The tag is moved first and the release is never deleted.**
          # Deleting and recreating would leave a window with no unstable
          # release at all, and a job that failed in that window would leave
          # the download page empty. Moving the tag and clobbering the assets
          # has no such window.
          git tag -f unstable "${GITHUB_SHA}"
          git push -f origin refs/tags/unstable

          if ! gh release view unstable >/dev/null 2>&1; then
            gh release create unstable \
              --prerelease \
              --title "unstable (${GITHUB_SHA:0:7})" \
              --notes "Built from master. This is not a release: it moves with every push, and it is not tested beyond the checks on this commit."
          fi

          gh release upload unstable artifacts/* --clobber
          gh release edit unstable --title "unstable (${GITHUB_SHA:0:7})"

      # **Only after the assets are up.** The page reads the release list at
      # build time, so a rebuild that ran first would publish the previous
      # state. Skipped entirely when nobody has configured the hook, so this is
      # inert until the secret exists rather than a red job.
      - name: Refresh the download page
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK:-}" ]; then
            echo "no NETLIFY_BUILD_HOOK is set, so the page will refresh on its next deploy"
            exit 0
          fi
          curl -fsS -X POST -d '{}' "${HOOK}" > /dev/null
          echo "asked the site to rebuild"
