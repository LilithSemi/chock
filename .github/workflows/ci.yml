on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - "release/**"
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  DeterminateCI:
    uses: DeterminateSystems/ci/.github/workflows/workflow.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      fail-fast: false

  test-sandbox:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Permit the nested user namespace
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          echo "before:"
          cat /proc/sys/user/max_user_namespaces || true
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null \
            || echo "no apparmor restriction on this runner"

          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

          if ! unshare -Ur true; then
            echo "::error::this runner refuses a user namespace, so the sandbox" \
                 "tests cannot run here. NOT skipping: a check that was not" \
                 "made is never a pass." >&2
            exit 1
          fi
          echo "a user namespace can be made on this runner"

      - name: Prove a Seatbelt profile can be entered
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          if ! /usr/bin/sandbox-exec -p '(version 1)(allow default)' /usr/bin/true; then
            echo "::error::this runner refuses a Seatbelt profile, so the" \
                 "sandbox tests cannot run here. NOT skipping: a check that" \
                 "was not made is never a pass." >&2
            exit 1
          fi
          echo "a Seatbelt profile can be entered on this runner"

      - name: Permit a delegated cgroup
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          echo "this job starts in:"
          cat /proc/self/cgroup

          # **The cgroup layer is the third sandbox layer, and it was the only
          # one this file did not prove.** Four tests in
          # lib/chock-sandbox/linux/cgroup.zig and one in linux/driver.zig need
          # an ancestor cgroup that delegates the controllers AND that this
          # user may create a subdirectory in. A runner puts every step under
          # system.slice, which delegates nothing, so all five answered
          # SkipZigTest and the layer went untested. Measured on the author's
          # own machine: with the cgroup below, skips drop from 9 to 4 and the
          # five run and pass.
          sudo mkdir -p /sys/fs/cgroup/chock/leaf
          echo "+cpu +io +memory +pids" \
            | sudo tee /sys/fs/cgroup/chock/cgroup.subtree_control > /dev/null
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/chock

          # The proof, and not the assumption: make a directory as this user,
          # which is the one thing every one of those tests does first.
          if ! mkdir /sys/fs/cgroup/chock/proof; then
            echo "::error::this runner refuses a delegated cgroup, so the" \
                 "cgroup tests cannot run here. NOT skipping: a check that" \
                 "was not made is never a pass." >&2
            exit 1
          fi
          rmdir /sys/fs/cgroup/chock/proof
          echo "a cgroup can be delegated on this runner"

      - name: Test the sandbox for real
        run: |
          set -euo pipefail
          # **The move happens here and not in the step above**, because every
          # step is its own shell and a cgroup a dead shell was in moves
          # nothing. The tests read /proc/self/cgroup and walk up from it, so
          # the process that runs them is the one that has to be inside.
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo sh -c "echo $$ > /sys/fs/cgroup/chock/leaf/cgroup.procs"
            echo "the tests run in:"
            cat /proc/self/cgroup
          fi
          nix develop --command zig build test --summary all

  release:
    if: github.event_name != 'pull_request'
    needs: [DeterminateCI, test-sandbox]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build the release artefacts
        run: |
          set -euo pipefail
          version=$(nix eval .#default.version --raw)

          # **A version-less copy is made for a tagged release alone.**
          # GitHub serves `releases/latest/download/<name>` out of the latest
          # FULL release and never out of a prerelease, and every unstable
          # build is a prerelease. So on those, a second copy is the same
          # bytes under a name nothing resolves: it doubled the assets of
          # every unstable release and nobody could reach half of them.
          case "${GITHUB_REF}" in
            refs/tags/v*) permanent_name=1 ;;
            *) permanent_name=0 ;;
          esac

          mkdir -p artifacts
          # **macOS is cross compiled from here and not built on a Mac.**
          # Measured 2026-09-16: `zig build -Dtarget=aarch64-macos` on Linux
          # produces a real Mach-O arm64 executable. The site says Chock runs on
          # Linux and macOS, so a release that shipped Linux alone left half the
          # readers with no file at all.
          #
          # **Apple Silicon only, and no `x86_64-macos`.** It cross compiles
          # cleanly, so this is not a limit of the toolchain. macOS 27 shipped
          # on 2026-09-14 and dropped every Intel Mac; Tahoe 26 was the last
          # release that ran on one, and it holds security updates only into
          # 2028. A new tool shipping an Intel Mac binary now is building for a
          # platform that ended this month.
          for target in x86_64-linux aarch64-linux aarch64-macos; do
            name="chock-${version}-${target}"
            nix develop --command zig build \
              -Doptimize=ReleaseSmall \
              -Dtarget="${target}" \
              -Dversion="${version}" \
              --prefix "build/${target}"
            # **A tarball and not a bare binary.** Apache-2.0 asks that the
            # licence travels with the distribution, and a bare binary carries
            # nothing. A tarball also keeps the executable bit, which a browser
            # download drops, and unpacks to a plain `chock` so nobody has to
            # rename the file before they can run it.
            #
            # **It unpacks into a directory of its own, not into the current
            # one.** A flat tarball holding `chock`, `LICENSE` and `README.md`
            # would overwrite a README.md the reader already had, in whatever
            # directory they happened to be standing in. One path segment is a
            # small price for never doing that.
            #
            # **Built for reproducibility**: a fixed owner, group and time, a
            # sorted member order, and `gzip -n` so the archive carries no
            # timestamp of its own. Two builds of the same commit then give the
            # same digest, which is what makes SHA256SUMS worth publishing for
            # a tool whose whole claim is about boundaries.
            shapes=("${name}")
            if [ "${permanent_name}" = 1 ]; then
              shapes+=("chock-${target}")
            fi
            for shape in "${shapes[@]}"; do
              rm -rf "stage/${shape}"
              mkdir -p "stage/${shape}"
              cp "build/${target}/bin/chock" "stage/${shape}/chock"
              cp LICENSE README.md "stage/${shape}/"
              tar --sort=name \
                  --owner=0 --group=0 --numeric-owner \
                  --mtime="@${SOURCE_DATE_EPOCH:-0}" \
                  -C stage -cf - "${shape}" \
                | gzip -n > "artifacts/${shape}.tar.gz"
            done
          done

          # **A digest beside every artefact.** A tool whose whole claim is
          # about boundaries, downloaded with nothing to check it against, is
          # the first thing a sceptic points at. Written last so it covers the
          # version-less copy too, on a release that has one.
          ( cd artifacts && sha256sum chock-*.tar.gz > SHA256SUMS )

          ls -l artifacts
          cat artifacts/SHA256SUMS

          reported="$(./build/x86_64-linux/bin/chock --version)"
          echo "the binary reports: ${reported}"
          case "${reported}" in
            "chock ${version}"*) ;;
            *) echo "::error::${reported} does not agree with ${version}" >&2; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v5
        with:
          name: chock-release
          path: artifacts/
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # **Draft first, assets second, published last**, the same order
          # the unstable step below explains: a release is immutable once it
          # is published, so its assets can never be added or replaced after
          # that. A release published empty stays empty.
          #
          # **So this job cannot be re-run over a published tag.** Immutability
          # is what refuses it, and that is the point of immutability: the
          # bytes under a version never change. Cut a new version instead.
          # **A candidate is published as a prerelease.** `releases/latest`
          # and `releases/latest/download/<name>` are both served from the
          # newest FULL release, so a candidate published as one would put
          # itself in front of every reader who asked for the release. A tag
          # carrying a pre-release part is exactly what a candidate is:
          # `v0.1.0-rc1` has one and `v0.1.0` does not.
          mark=()
          case "${GITHUB_REF_NAME}" in
            *-*) mark=(--prerelease) ;;
          esac

          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --verify-tag \
              ${mark[@]+"${mark[@]}"} \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" artifacts/* --clobber
          gh release edit "${GITHUB_REF_NAME}" --draft=false

      # **A rolling build of master that a stranger can actually download.**
      # Measured 2026-09-16: a workflow artefact answers `401` to an anonymous
      # request even on a public repository, and it expires after ninety days.
      # So without this, nothing built from master is reachable by anybody who
      # is not signed in. A prerelease is anonymous and does not expire.
      - name: Publish the rolling unstable build
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag=$(nix eval .#default.version --raw)

          # **A tag per build, and never a tag that moves.** A release is
          # immutable once it is published, so the assets of one that already
          # exists can never be replaced. The first design moved a single
          # `unstable` tag and clobbered its assets, and GitHub answered
          # `422 Cannot upload assets to an immutable release` on
          # 2026-09-17. A release that is written once and never touched
          # again is the only shape immutability leaves.
          git tag "${tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${tag}"

          # **Draft first, assets second, published last.** Immutability
          # closes a release to new assets at the moment it is published, so
          # the order here is the whole fix: a release published empty can
          # never be filled.
          gh release create "${tag}" \
            --draft \
            --prerelease \
            --title "unstable (${GITHUB_SHA:0:7})" \
            --generate-notes
          gh release upload "${tag}" artifacts/*
          gh release edit "${tag}" --draft=false

          # **Matched on `-unstable` inside the tag, and never on the
          # prerelease flag.** The tag is the version now, so an unstable
          # build is `0.1.0-unstable-<date>-<rev>` and a release candidate
          # somebody cut by hand is `1.0.0-rc1`. Both are prereleases, and
          # only one of them is this job's to delete: matching the flag alone
          # would eventually eat a release candidate.
          #
          # **Pruned, because one release per push grows without bound.**
          # The newest few stay, so a person who linked to one yesterday is
          # not immediately broken, and the rest go with their tags.
          #
          # **A failure here is reported and never fatal.** Whether an
          # immutable release can be deleted at all is a property of the
          # repository's own settings, and a build of master that already
          # published its artefacts must not go red over tidying.
          keep=5
          mapfile -t stale < <(
            gh release list --limit 100 --json tagName,isPrerelease \
              --jq "[.[] | select(.isPrerelease and (.tagName | contains(\"-unstable\")))] | .[${keep}:] | .[].tagName"
          )
          for old in "${stale[@]:-}"; do
            [ -z "${old}" ] && continue
            gh release delete "${old}" --yes --cleanup-tag \
              || echo "::warning::${old} could not be deleted, so unstable builds are accumulating"
          done

      # **Only after the assets are up.** The page reads the release list at
      # build time, so a rebuild that ran first would publish the previous
      # state. Skipped entirely when nobody has configured the hook, so this is
      # inert until the secret exists rather than a red job.
      - name: Refresh the download page
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK:-}" ]; then
            echo "no NETLIFY_BUILD_HOOK is set, so the page will refresh on its next deploy"
            exit 0
          fi
          curl -fsS -X POST -d '{}' "${HOOK}" > /dev/null
          echo "asked the site to rebuild"
